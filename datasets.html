<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Example</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s ease;
        }

        li:hover {
            transform: scale(1.05);
        }

        li[data-category="fruit"] {
            background-color: lightyellow;
        }

        li[data-category="vegetable"] {
            background-color: lightgreen;
        }

        li[data-category="dairy"] {
            background-color: lightblue;
        }

        #details {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <h1>Items List</h1>
    <ul id="items">
        <li data-name="banana" data-category="fruit" data-color="yellow">Banana</li>
        <li data-name="carrot" data-category="vegetable" data-color="orange">Carrot</li>
        <li data-name="blueberry" data-category="fruit" data-color="blue">Blueberry</li>
        <li data-name="milk" data-category="dairy" data-color="white">Milk</li>
    </ul>

    <div id="details">
        <h2>Item Details</h2>
        <p>Click an item to see details here.</p>
    </div>

    <script>
        const items = document.querySelectorAll('#items li');
        const details = document.getElementById('details');

        items.forEach(item => {
            item.addEventListener('click', () => {
                details.innerHTML = `
                  <h2>Item Details</h2>
                  <p><strong>Name:</strong> ${item.dataset.name}</p>
                  <p><strong>Category:</strong> ${item.dataset.category}</p>
                  <p><strong>Color:</strong> ${item.dataset.color}</p>
                `;
            });
        });
    </script>
</body>
</html>
